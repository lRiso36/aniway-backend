services:

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file: 
      - .env
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    networks: 
      - internal

  mongo:
    image: mongo:6
    container_name: aniway-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks: 
      - internal

  mongo-express:
    image: mongo-express
    container_name: aniway-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      - mongo
    networks: 
      - internal
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - internal

networks: 
  internal:

volumes:
  mongo_data:

